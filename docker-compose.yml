services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: loans
      POSTGRES_USER: loans
      POSTGRES_PASSWORD: loans
    ports:
      - "5434:5432"   # 5434 on the host avoids clashing with a locally installed Postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loans -d loans"]
      interval: 2s
      timeout: 3s
      retries: 15

  external-service:
    build:
      context: .
      dockerfile: external-service/ExternalService.Mock/Dockerfile
    environment:
      FAIL_RATE: ${FAIL_RATE:-0}
    ports:
      - "5090:8080"

  api:
    build:
      context: .
      dockerfile: backend/src/Loans.Api/Dockerfile
    environment:
      ConnectionStrings__Loans: Host=db;Port=5432;Database=loans;Username=loans;Password=loans
      ExternalService__BaseUrl: http://external-service:8080
      Cors__AllowedOrigins__0: http://localhost:3000
    ports:
      - "5080:8080"
    depends_on:
      db:
        condition: service_healthy
      external-service:
        condition: service_started

  frontend:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db-data:
